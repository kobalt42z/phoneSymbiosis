[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/backends/linux",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kobalt42z/phoneSymbiosis"

[workspace.dependencies]
phonesym-core = { path = "crates/core" }
phonesym-platform = { path = "crates/platform" }
phonesym-backend-linux = { path = "crates/backends/linux" }

async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
