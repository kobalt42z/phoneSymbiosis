[package]
name = "phonesym-desktop"
description = "PhoneSymbiosis desktop app (Tauri). Depends on phonesym-platform only, never on a backend directly."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "phonesymbiosis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The only PhoneSymbiosis dependency: it picks the backend for the target OS.
phonesym-platform.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
