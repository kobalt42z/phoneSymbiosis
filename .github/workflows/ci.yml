name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        working-directory: apps/desktop
        run: npm ci && npm run build
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  # Builds the Windows 11 x64 installers on every push, so a test build can be
  # downloaded from the run's "Artifacts" section.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build desktop app (.msi + setup .exe)
        working-directory: apps/desktop
        run: npx tauri build --bundles msi,nsis
      - name: Build CLI
        run: cargo build --release -p phonesym-cli
      - run: cargo test -p phonesym-core -p phonesym-backend-windows -p phonesym-cli
      - run: cargo clippy -p phonesym-backend-windows -p phonesym-platform -p phonesym-cli -p phonesym-desktop -- -D warnings
      - name: Collect files
        shell: bash
        run: |
          mkdir dist
          cp target/release/bundle/msi/*.msi dist/
          cp target/release/bundle/nsis/*.exe dist/
          cp target/release/phonesym.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: phonesymbiosis-windows-x64
          path: dist/*
