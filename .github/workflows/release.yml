name: Release

# Builds the Ubuntu installer (.deb), an AppImage and the `phonesym` CLI,
# then publishes them as a GitHub release.
#
# To publish: bump "version" in apps/desktop/src-tauri/tauri.conf.json
# (and apps/desktop/package.json), merge, then either:
#   - create a release on GitHub with a new tag like 0.2.0 or v0.2.0, or
#   - push a tag: git tag v0.2.0 && git push origin v0.2.0
# To (re)build files for an existing release, use "Run workflow" in the
# Actions tab and enter its tag. Leave the tag empty to only build.

on:
  push:
    tags: ["v[0-9]*", "[0-9]*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach files to (e.g. 0.1.0). Empty = build only."
        required: false
        default: ""

permissions:
  contents: write

# Creating a release on GitHub fires both "push tag" and "release"; build once.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    # Built on 24.04 so the packages also install on newer Ubuntu (26.04).
    runs-on: ubuntu-24.04
    env:
      # The tag to publish to, or empty for a build-only run.
      TAG: ${{ github.event.release.tag_name || inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Check tag matches app version
        if: env.TAG != ''
        run: |
          app_version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "${TAG#v}" != "$app_version" ]; then
            echo "Tag $TAG does not match app version $app_version in tauri.conf.json"
            exit 1
          fi

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop app (.deb + AppImage)
        working-directory: apps/desktop
        run: npx tauri build --bundles deb,appimage

      - name: Build CLI
        run: cargo build --release -p phonesym-cli

      - name: Collect files
        run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb dist/
          cp target/release/bundle/appimage/*.AppImage dist/
          tar -czf dist/phonesym-cli-linux-x86_64.tar.gz -C target/release phonesym
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: phonesymbiosis-linux
          path: dist/*

      # Creates the release, or adds the files to it if it already exists.
      - name: Publish release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          overwrite_files: true
