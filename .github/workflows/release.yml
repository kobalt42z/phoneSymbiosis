name: Release

# Builds the Ubuntu installer (.deb), an AppImage and the `phonesym` CLI,
# then publishes them as a GitHub release.
#
# To publish: bump "version" in apps/desktop/src-tauri/tauri.conf.json
# (and apps/desktop/package.json), merge, then push a matching tag:
#   git tag v0.1.0 && git push origin v0.1.0
# "Run workflow" in the Actions tab builds the files without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Built on 24.04 so the packages also install on newer Ubuntu (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app_version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "v$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $app_version in tauri.conf.json"
            exit 1
          fi

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop app (.deb + AppImage)
        working-directory: apps/desktop
        run: npx tauri build --bundles deb,appimage

      - name: Build CLI
        run: cargo build --release -p phonesym-cli

      - name: Collect files
        run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb dist/
          cp target/release/bundle/appimage/*.AppImage dist/
          tar -czf dist/phonesym-cli-linux-x86_64.tar.gz -C target/release phonesym
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: phonesymbiosis-linux
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install on Ubuntu
            ```sh
            sudo apt install ./PhoneSymbiosis_*_amd64.deb
            ```
            Then pair your phone from the **Devices** page. After pairing, on the iPhone open
            Settings → Bluetooth → (i) next to your PC and turn on **Sync Contacts** and
            **Show Notifications**.

            `phonesym-cli-linux-x86_64.tar.gz` contains the command-line tool (`phonesym doctor` checks your setup).
